[package]
name = "snowdrift-linux"
version = "0.6.1"
edition = "2024"
publish = false
description = "Snowfall over every window on Linux"

[[bin]]
name = "snowdrift"
path = "src/main.rs"

[dependencies]
snowdrift-core = { path = "../core" }
x11rb = { version = "0.13", features = ["shape", "randr", "xfixes", "composite"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
